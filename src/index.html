    <!-- The splash that is actually seen: iOS 27 ignores the startup images and shows a blank
         dark screen (theme-color) first. The splash continues it in the same colour, whatever the
         theme, fades the mark in, and main.ts fades it out over the app. -->
    <style>
      .splash {
        --bg: #1d221f;
        --fg: #f1c40f;
        --ring: rgba(241, 196, 15, 0.07);
        --cap: #b9c2bb;
        --tick: rgba(241, 196, 15, 0.45);
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: var(--bg);
        /* Covers the app only to the eye: taps already reach it while the splash fades. */
        pointer-events: none;
        transition: opacity 0.3s ease-in;
      }
      .splash.splash-out {
        opacity: 0;
      }
      .splash svg {
        position: absolute;
        left: 50%;
        overflow: visible;
        animation: splash-in 0.35s ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .splash svg {
          transition: none;
          animation: none;
        }
      }
      .splash .mark {
        top: 45%;
        width: min(72vw, 300px);
        transform: translate(-50%, -50%);
      }
      /* Percentages of the fixed box: installed iOS apps can report vh short at launch. */
      .splash .caption {
        top: calc(45% + min(72vw, 300px) * 50 / 443 + 46px);
        width: 1px;
        height: 1px;
        font-size: 3.4vw;
      }
      .splash .ruler {
        bottom: calc(max(96px, 11%) - 6px);
        width: min(42vw, 170px);
        height: 12px;
        transform: translateX(-50%);
      }
      .splash .rings circle,
      .splash .ruler path {
        vector-effect: non-scaling-stroke;
      }
    </style>
    <noscript><style>.splash { display: none; }</style></noscript>
