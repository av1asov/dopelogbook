<div class="status-bar" aria-hidden="true"></div>

@if (updateReady()) {
  <button class="update" type="button" (click)="restart()">
    Доступно обновление — перезапустить
  </button>
}

<main class="content">
  <router-outlet />
</main>

<nav class="tabs" aria-label="Разделы">
  <a routerLink="/journal" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" />
      <path d="M9 9h6M9 13h6" />
    </svg>
    Журнал
  </a>
  <a routerLink="/range" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8" />
      <circle cx="12" cy="12" r="3" />
      <path d="M12 1v5M12 18v5M1 12h5M18 12h5" />
    </svg>
    Рубеж
  </a>
  <a routerLink="/card" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="3" width="16" height="18" rx="1" />
      <path d="M4 9h16M4 15h16M10 3v18" />
    </svg>
    Карта
  </a>
  <a routerLink="/stats" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 20V4M4 20h16" />
      <path d="M8 16l4-5 3 3 5-7" />
    </svg>
    Статистика
  </a>
  <a routerLink="/more" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="5" cy="12" r="1.5" />
      <circle cx="12" cy="12" r="1.5" />
      <circle cx="19" cy="12" r="1.5" />
    </svg>
    Ещё
  </a>
</nav>
